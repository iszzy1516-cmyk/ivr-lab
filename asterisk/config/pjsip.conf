; -----------------------------------------------------------------------------
; PJSIP configuration for the contact center lab.
;
; Two softphone accounts are pre-provisioned for agents:
;   6001 / pass6001   (Alice)
;   6002 / pass6002   (Bob)
; Inbound demo IVR is reached by dialing 9000.
; -----------------------------------------------------------------------------

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Address softphones see in Contact/SDP. Must be the Docker host's LAN IP.
external_signaling_address=__EXTERNAL_IP__
external_media_address=__EXTERNAL_IP__
allow_reload=yes

; --- templates ---------------------------------------------------------------

[endpoint-common](!)
type=endpoint
context=default
allow=ulaw,alaw,gsm
; Phones are on the LAN behind NAT-ish Docker networking:
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no
dtmf_mode=rfc4733
language=en

[aor-common](!)
type=aor
max_contacts=1
remove_existing=yes

[auth-common](!)
type=auth
auth_type=userpass

; --- agent softphones --------------------------------------------------------

[6001](endpoint-common)
aors=6001
auth=6001-auth
callerid="Alice Agent" <6001>

[6001](aor-common)

[6001-auth](auth-common)
username=6001
password=pass6001

[6002](endpoint-common)
aors=6002
auth=6002-auth
callerid="Bob Agent" <6002>

[6002](aor-common)

[6002-auth](auth-common)
username=6002
password=pass6002

; Unauthenticated guest endpoint: lets SIPp (and anything else on the LAN)
; reach the public dialplan without registration. Lab-only; fail2ban later.
[anonymous](endpoint-common)
context=public
aors=anonymous

[anonymous](aor-common)
; no auth section: INVITEs only, no registration
