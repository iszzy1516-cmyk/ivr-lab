[modules]
; Autoload the standard set, but make sure the pieces we rely on are explicit.
autoload=yes

; chan_sip is dead in Asterisk 20, chan_pjsip is the SIP channel driver.
noload => chan_sip.so

; ARI framework + resources (used by the FastAPI backend).
load => res_ari.so
load => res_ari_applications.so
load => res_ari_asterisk.so
load => res_ari_bridges.so
load => res_ari_channels.so
load => res_ari_device_states.so
load => res_ari_endpoints.so
load => res_ari_events.so
load => res_ari_model.so
load => res_ari_playbacks.so
load => res_ari_recordings.so
load => res_ari_sounds.so

; Stasis() dialplan application -> hands channels to ARI.
load => res_stasis.so
