[general]
static=yes
writeprotect=no

; -----------------------------------------------------------------------------
; Dialplan. All real call logic lives in the FastAPI backend via ARI:
; incoming calls are dumped into Stasis(ivr) and the backend drives the IVR,
; queues and agent bridging.
; -----------------------------------------------------------------------------

[public]
; Demo entry point: IVR (sales=1, support=2)
exten => 9000,1,Stasis(ivr,inbound)

; Direct-to-queue shortcuts — also used by the headless E2E test.
exten => 9001,1,Stasis(ivr,inbound,sales)
exten => 9002,1,Stasis(ivr,inbound,support)

[default]
; Softphones land here.
include => public

; Agent-to-agent direct dialing, handy for smoke-testing audio both ways.
exten => _6XXX,1,Dial(PJSIP/${EXTEN},20)
exten => _6XXX,n,Hangup()

; Test hook: auto-answering "agent" for headless E2E tests. The backend (or a
; manual ARI originate) can use Local/agent-auto@default as the agent leg.
exten => agent-auto,1,Answer()
exten => agent-auto,n,Wait(300)
exten => agent-auto,n,Hangup()

; Test hook: parking spot for the far leg of headless test calls
; (originate Local/9000@default with extension=park, context=default).
exten => park,1,Wait(300)
exten => park,n,Hangup()
